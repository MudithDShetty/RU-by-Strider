plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

import java.security.MessageDigest

static String sha256Hex(File file) {
    if (file == null || !file.exists()) return ""
    def digest = MessageDigest.getInstance("SHA-256")
    file.withInputStream { stream ->
        byte[] buffer = new byte[256 * 1024]
        int read
        while ((read = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().collect { String.format("%02x", it) }.join()
}

// Keep in sync with embeddingmodel/build.gradle syncModelAsset source order.
def embeddingModelCandidates = [
    file("${rootProject.projectDir}/model_assets/onnx/model_int8.onnx"),
    file("${rootProject.projectDir}/app/src/debug/assets/embedding_model.onnx"),
    file("${rootProject.projectDir}/embeddingmodel/src/main/assets/embedding_model.onnx"),
]
def embeddingModelFile = embeddingModelCandidates.find { it.exists() }
def embeddingModelBytes = embeddingModelFile != null ? embeddingModelFile.length() : 0L
def embeddingModelSha256 = embeddingModelFile != null ? sha256Hex(embeddingModelFile) : ""

def fp32ModelCandidates = [
    file("${rootProject.projectDir}/model_assets/onnx/model.onnx"),
    file("${rootProject.projectDir}/app/src/debug/assets/embedding_model_fp32.onnx"),
    file("${rootProject.projectDir}/embeddingmodel_fp32/src/main/assets/embedding_model_fp32.onnx"),
]
def fp32ModelFile = fp32ModelCandidates.find { it.exists() && it.length() > 200L * 1024 * 1024 }
def fp32ModelBytes = fp32ModelFile != null ? fp32ModelFile.length() : 0L
def fp32ModelSha256 = fp32ModelFile != null ? sha256Hex(fp32ModelFile) : ""

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.strider.ru'
    compileSdk 36

    assetPacks = [":embeddingmodel", ":embeddingmodel_fp32"]

    defaultConfig {
        applicationId "com.strider.ru"
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName "1.0.2"
        buildConfigField "boolean", "PROBE_NNAPI", "true"
        buildConfigField "long", "MODEL_BYTES", "${embeddingModelBytes}L"
        buildConfigField "long", "MODEL_FP32_BYTES", "${fp32ModelBytes}L"
        buildConfigField "String", "MODEL_SHA256", "\"${embeddingModelSha256}\""
        buildConfigField "String", "MODEL_FP32_SHA256", "\"${fp32ModelSha256}\""
        buildConfigField "int", "MODEL_VERSION", "3"
        buildConfigField "String", "PRIVACY_POLICY_URL", "\"https://striderhq.co/privacy\""
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "PROBE_NNAPI", "false"
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        debug {
            assets.srcDirs += ['src/debug/assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Prevent ONNX model from being compressed inside the APK
    // (compressed assets can't be memory-mapped at runtime)
    aaptOptions {
        noCompress "onnx"
    }
}

android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name == "release") {
        variant.mergeAssetsProvider.configure { mergeTask ->
            mergeTask.doLast {
                delete(fileTree(mergeTask.outputDir.get()).matching { include "**/embedding_model.onnx" })
            }
        }
    }
}

dependencies {
    // Play Asset Delivery — fast-follow embedding model pack
    implementation 'com.google.android.play:asset-delivery:2.2.2'
    implementation 'com.google.android.play:asset-delivery-ktx:2.2.2'

    // ONNX Runtime — runs the embedding model locally (1.22+ required for 16 KB page size / API 35 Play)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'

    // Coroutines — keeps inference off the main thread
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // WorkManager — background indexing survives app close
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // LiveData observer for WorkManager progress in MainActivity
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // Standard Android UI
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // JSON parsing (for tokenizer config)
    implementation 'com.google.code.gson:gson:2.10.1'

    // PDF text extraction
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // OCR for scanned PDFs (deferred background worker)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

// EXIF data from images
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

// Audio ID3 tags
    implementation 'net.jthink:jaudiotagger:3.0.1'

    testImplementation 'junit:junit:4.13.2'
}

def debugModelSources = [
    file("${rootProject.projectDir}/model_assets/onnx/model_int8.onnx"),
    file("${rootProject.projectDir}/model_assets/onnx/model.onnx"),
    file("${rootProject.projectDir}/embeddingmodel/src/main/assets/embedding_model.onnx"),
]
def debugModelSource = debugModelSources.find { it.exists() }
def debugFp32Source = fp32ModelFile

tasks.register("syncDebugModelAsset") {
    doLast {
        if (debugModelSource == null) {
            logger.warn("No embedding model found for debug — copy model to app/src/debug/assets/embedding_model.onnx")
            return
        }
        def destDir = file("src/debug/assets")
        destDir.mkdirs()
        def dest = file("${destDir}/embedding_model.onnx")
        if (!dest.exists() || dest.length() != debugModelSource.length()) {
            copy {
                from debugModelSource
                into destDir
                rename { "embedding_model.onnx" }
            }
        }
        if (debugFp32Source != null) {
            def fp32Dest = file("${destDir}/embedding_model_fp32.onnx")
            if (!fp32Dest.exists() || fp32Dest.length() != debugFp32Source.length()) {
                copy {
                    from debugFp32Source
                    into destDir
                    rename { "embedding_model_fp32.onnx" }
                }
            }
        }
    }
}

afterEvaluate {
    tasks.matching { it.name == "preDebugBuild" }.configureEach {
        dependsOn("syncDebugModelAsset")
    }
}
